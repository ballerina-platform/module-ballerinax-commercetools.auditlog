openapi: 3.0.0
info:
  title: commercetools Change History API
  description: Query the change history of commercetools project resources, including who changed what
    and when, using REST or GraphQL requests.
  version: '1'
servers:
- url: https://history.us-central1.gcp.commercetools.com
paths:
  /{projectKey}:
    get:
      summary: List change history of project resources
      description: 'The `view_audit_log:{projectKey}` scope is required, and depending on the [resource
        type](ctp:history:type:ChangeHistoryResourceType) queried, their respective scopes must be granted.


        If the request exceeds the rate limit, a [TooManyRequests](ctp:history:type:TooManyRequestsError)
        error is returned.'
      operationId: listChangeHistory
      parameters:
      - name: resourceTypes
        in: query
        description: Resource types to include in the change history
        required: false
        style: form
        explode: true
        schema:
          type: array
          items:
            $ref: '#/components/schemas/ChangeHistoryResourceType'
      - name: date.from
        in: query
        description: Start of the time range, as a date-time or a number of hours before now. Defaults
          to 24 hours ago
        required: false
        style: form
        explode: true
        schema:
          $ref: '#/components/schemas/DateFilter'
        x-annotation-default: 24
        x-ballerina-name: dateFrom
      - name: date.to
        in: query
        description: End of the time range, as a date-time or `now`. Defaults to `now`
        required: false
        style: form
        explode: true
        schema:
          $ref: '#/components/schemas/DateFilter'
        x-annotation-default: now
        x-ballerina-name: dateTo
      - name: limit
        in: query
        description: Maximum number of records to return. Defaults to 20
        required: false
        style: form
        explode: true
        schema:
          type: integer
          format: int32
        x-annotation-default: 20
      - name: offset
        in: query
        description: Number of records to skip, for pagination
        required: false
        style: form
        explode: true
        schema:
          type: integer
          format: int32
        x-annotation-default: 0
      - name: userId
        in: query
        description: Filter changes made by the user with this ID
        required: false
        style: form
        explode: true
        schema:
          type: string
      - name: userIds
        in: query
        description: Filter changes made by the users with these IDs
        required: false
        style: form
        explode: true
        schema:
          type: array
          items:
            type: string
      - name: clientId
        in: query
        description: Filter changes made through the API client with this ID
        required: false
        style: form
        explode: true
        schema:
          type: string
      - name: customerId
        in: query
        description: Filter changes made by the customer with this ID
        required: false
        style: form
        explode: true
        schema:
          type: string
      - name: associateId
        in: query
        description: Filter changes made by the associate with this ID
        required: false
        style: form
        explode: true
        schema:
          type: string
      - name: businessUnit
        in: query
        description: Filter changes made on behalf of the business unit with this key
        required: false
        style: form
        explode: true
        schema:
          type: string
      - name: type
        in: query
        description: Filter records by the type of the change
        required: false
        style: form
        explode: true
        schema:
          type: string
      - name: resourceId
        in: query
        description: Filter records by the ID of the changed resource
        required: false
        style: form
        explode: true
        schema:
          type: string
      - name: resourceIds
        in: query
        description: Filter records by the IDs of the changed resources
        required: false
        style: form
        explode: true
        schema:
          type: array
          items:
            type: string
      - name: resourceKey
        in: query
        description: Filter records by the keys of the changed resources
        required: false
        style: form
        explode: true
        schema:
          type: string
      - name: source
        in: query
        description: Filter records by the origin of the change, for example the Merchant Center or the
          API
        required: false
        style: form
        explode: true
        schema:
          $ref: '#/components/schemas/Source'
      - name: changes
        in: query
        description: Filter records by the type of change, for example `addLineItem` or `setName`
        required: false
        style: form
        explode: true
        schema:
          type: array
          items:
            type: string
      - name: stores
        in: query
        description: Filter changes made in the stores with these keys
        required: false
        style: form
        explode: true
        schema:
          type: array
          items:
            type: string
      - name: excludePlatformInitiatedChanges
        in: query
        description: Whether to leave out changes made by the commercetools platform itself
        required: false
        style: form
        explode: true
        schema:
          type: array
          items:
            $ref: '#/components/schemas/PlatformInitiatedChange'
      - name: expand
        in: query
        description: Reference expansion paths to resolve in the returned records
        required: false
        style: form
        explode: true
        schema:
          type: boolean
      - name: withTotal
        in: query
        description: Whether to include the total number of matching records in the response
        required: false
        style: form
        explode: true
        schema:
          type: boolean
        x-annotation-default: false
      responses:
        '200':
          description: Records of the resource under query
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RecordPagedQueryResponse'
        '400':
          description: Bad Request. A 400 is the most commonly expected error response and indicates that
            a request failed due to providing bad input. Bad input can be a malformed request body, missing
            required parameters, wrongly typed or malformed parameters or a parameter that references
            another resource that does not exist. Clients need to resolve the problems mentioned in the
            response before re-sending the request.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '401':
          description: Unauthorized. Indicate that the request is not properly authenticated.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '403':
          description: Forbidden. Indicates that the authenticated client is not allowed to perform the
            request.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '429':
          description: Too Many Requests. Indicates that the client has exceeded the API rate limit. Reduce
            the date range and resource types in your query to minimize the token usage, or retry the
            request after some time (indicated in the `Retry-After` header).
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '500':
          description: Internal Server Error. A 500 indicates that the request failed due to a server-side
            problem that needs to be resolved before subsequent requests can succeed. It either indicates
            a temporary unavailability or permanent server-side problem that needs to be reported and
            resolved.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '503':
          description: 'Service Unavailable. The following general error codes can appear in responses
            with the HTTP status code `503`

            - `OverCapacity` The service is having trouble handling the load. The client application should
            retry the request with exponential backoff up to a point where further delay is unacceptable.'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
      security:
      - oauth_2_0:
        - view_associate_roles:{projectKey}
        - view_audit_log:{projectKey}
        - view_business_units:{projectKey}
        - view_cart_discounts:{projectKey}
        - view_categories:{projectKey}
        - view_customers:{projectKey}
        - view_customers:{projectKey}:{storeKey}
        - view_customer_groups:{projectKey}
        - view_discount_codes:{projectKey}
        - view_key_value_documents:{projectKey}
        - view_orders:{projectKey}
        - view_orders:{projectKey}:{storeKey}
        - view_payments:{projectKey}
        - view_products:{projectKey}
        - view_product_selections:{projectKey}
        - view_quotes:{projectKey}
        - view_quote_requests:{projectKey}
        - view_shipping_methods:{projectKey}
        - view_shopping_lists:{projectKey}
        - view_shopping_lists:{projectKey}:{storeKey}
        - view_staged_quotes:{projectKey}
        - view_standalone_prices:{projectKey}
        - view_states:{projectKey}
        - view_stores:{projectKey}
        - view_tax_categories:{projectKey}
        - view_types:{projectKey}
    parameters:
    - name: projectKey
      in: path
      description: The key of the commercetools Project whose change history to read
      required: true
      style: simple
      explode: false
      schema:
        type: string
  /{projectKey}/graphql:
    post:
      summary: Query change history with GraphQL
      description: Execute a GraphQL request.
      operationId: queryChangeHistory
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/GraphQLRequest'
        description: GraphQL query and variables to run against the change history
      responses:
        '200':
          description: Result of the GraphQL query
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/GraphQLResponse'
      security:
      - oauth_2_0:
